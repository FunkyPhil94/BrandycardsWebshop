"$schema" = "./node_modules/wrangler/config-schema.json"

name = "brandycards-webshop"
account_id = "7d38e966a0bd1a5ed4843ab57f07324e"
main = "worker/index.ts"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "shop.brandycards.de", zone_name = "brandycards.de", custom_domain = true, enabled = true, previews_enabled = false }
]

[vars]
EBAY_ENVIRONMENT = "production"
EBAY_MARKETPLACE_ID = "EBAY_DE"
EBAY_OAUTH_SCOPE = "https://api.ebay.com/oauth/api_scope/sell.inventory.readonly"
EBAY_WRITE_OAUTH_SCOPE = "https://api.ebay.com/oauth/api_scope/sell.inventory"
EBAY_WRITE_ENABLED = "false"
EBAY_RUNAME = "BrandyCards_GbR-BrandyCa-Brandy-cqibopjv"
EBAY_OAUTH_CALLBACK_URL = "https://shop.brandycards.de/api/admin/ebay/oauth/callback"

# Alle 10 Minuten statt stündlich. Jede Karte ist ein Einzelstück und steht
# gleichzeitig hier und auf eBay; wird sie dort verkauft, erfährt der Shop es
# erst beim nächsten Import und verkauft sie bis dahin weiter. Das Fenster
# schrumpft damit von bis zu 60 auf bis zu 10 Minuten.
#
# Kosten: ein Lauf sind drei eBay-Aufrufe (ein Token, zwei Seiten à 200
# Angebote bei 296 Karten). 432 statt 72 am Tag, gegen ein Standardkontingent
# von 5 000 — unkritisch.
#
# Zweite Wirkung: `releaseExpiredReservations` hängt am selben Lauf. Eine
# abgelaufene Reservierung wird damit nach 15–25 statt nach 15–75 Minuten
# freigegeben, was die Bestandssperre aus SEC-03 zusätzlich entschärft.
[triggers]
crons = ["*/10 * * * *"]

[assets]
binding = "ASSETS"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "brandycards-production"
database_id = "23ef186e-fca1-419e-97c2-e5f8f4bf38e6"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "brandycards-uploads"

# Ohne diese Blöcke fällt lib/rate-limit.ts auf einen Zähler im Arbeitsspeicher
# des Isolates zurück. Workers-Isolate sind kurzlebig und existieren vielfach
# parallel, die Begrenzung wäre damit wirkungslos — und zwar still.
# Zwei Namespaces, weil ein Binding genau eine Grenze trägt: Uploads brauchen
# eine engere als ein Kontaktformular. Die Werte müssen zu RATE_LIMIT_TIERS in
# lib/rate-limit-policy.ts passen; tests/rate-limit.test.mjs prüft das.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_STRICT"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
