"$schema" = "./node_modules/wrangler/config-schema.json"

name = "brandycards-webshop"
account_id = "7d38e966a0bd1a5ed4843ab57f07324e"
main = "worker/index.ts"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "shop.brandycards.de", zone_name = "brandycards.de", custom_domain = true, enabled = true, previews_enabled = false }
]

[vars]
# Seit dem 2026-08-08 nimmt der Shop echtes Geld ein.
#
# **Diese Zeile ist die einzige, die darüber entscheidet.** Fehlt sie oder
# steht hier etwas anderes als exakt "production", fällt `lib/paypal/config.ts`
# **still** auf `sandbox` zurück: Der Shop sähe vollkommen gesund aus, der
# Checkout liefe durch — und es käme kein Geld an. Genau dieser Zustand bestand
# vom 2026-08-06 bis heute unbemerkt und wurde erst beim Testkauf gefunden.
#
# Deshalb hält `tests/hardening.test.mjs` den Wert fest. Wer ihn ändern will,
# ändert dort mit — und merkt dabei, was er tut.
#
# Kein Geheimnis: Der Wert gehört bewusst hierher und nicht zu den
# Cloudflare-Secrets. Die drei Zugangsdaten (`PAYPAL_CLIENT_ID`,
# `PAYPAL_CLIENT_SECRET`, `PAYPAL_WEBHOOK_ID`) liegen dort.
PAYPAL_ENVIRONMENT = "production"
# Wohin die Verkäufernachricht mit der Lieferadresse geht. Ohne sie erfährt
# niemand, wohin das Paket soll — die Adresse stünde nur in der Datenbank.
# Kein Geheimnis: Dieselbe Adresse steht im Impressum und in der
# Datenschutzerklärung dieses Repositories.
SELLER_NOTIFICATION_EMAIL = "brandycards@gmx.de"
EBAY_ENVIRONMENT = "production"
EBAY_MARKETPLACE_ID = "EBAY_DE"
EBAY_OAUTH_SCOPE = "https://api.ebay.com/oauth/api_scope/sell.inventory.readonly https://api.ebay.com/oauth/api_scope/sell.fulfillment.readonly"
EBAY_WRITE_OAUTH_SCOPE = "https://api.ebay.com/oauth/api_scope/sell.inventory https://api.ebay.com/oauth/api_scope/sell.fulfillment https://api.ebay.com/oauth/api_scope/sell.fulfillment.readonly https://api.ebay.com/oauth/api_scope/commerce.notification.subscription"
EBAY_WRITE_ENABLED = "true"
EBAY_RUNAME = "BrandyCards_GbR-BrandyCa-Brandy-cqibopjv"
EBAY_OAUTH_CALLBACK_URL = "https://shop.brandycards.de/api/admin/ebay/oauth/callback"
EBAY_NOTIFICATION_ENDPOINT = "https://shop.brandycards.de/api/ebay/notifications"

# Drei Minuten, seit der Sync nur noch schreibt, was sich geändert hat
# (2026-08-08). Gemessen je Lauf: ~6 500 D1-Zeilen gelesen, **0 geschrieben**.
#
# **Die begrenzende Größe ist eBay, nicht Cloudflare.** Die Trading-API erlaubt
# 5 000 Aufrufe/Tag, und zwar als *gemeinsamer* Topf für Sync, Beschreibungs-
# abfrage, Bestandsprüfung an der Kasse und die Rücknahmen. Der Sync verbraucht
# davon 960/Tag. tests/ebay-stock-check.test.mjs rechnet das nach und gesteht
# dem Sync bewusst nur die Hälfte zu — ein Test, der ihm alle 5 000 zubilligte,
# ginge genau dann durch, wenn die Kasse nicht mehr prüfen kann.
#
# **Wer den Takt erhöhen will, verbilligt zuerst den Lauf.** Andersherum ging es
# am 2026-08-07 schon einmal schief: `*/10` lief wenige Stunden und musste
# zurückgenommen werden, weil ein Lauf damals noch ~5 396 Zeilen schrieb.
#
# **Beim Wachsen des Sortiments nachziehen:** Zwei Seitenabrufe je Lauf gelten
# bis 400 Angebote. Ab 401 werden es drei — der Verbrauch steigt sprunghaft,
# nicht gleitend. Die Zahl steht als ANGEBOTE im Test.
[triggers]
crons = ["*/3 * * * *"]

[assets]
binding = "ASSETS"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "brandycards-production"
database_id = "23ef186e-fca1-419e-97c2-e5f8f4bf38e6"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "brandycards-uploads"

# Ohne diese Blöcke fällt lib/rate-limit.ts auf einen Zähler im Arbeitsspeicher
# des Isolates zurück. Workers-Isolate sind kurzlebig und existieren vielfach
# parallel, die Begrenzung wäre damit wirkungslos — und zwar still.
# Zwei Namespaces, weil ein Binding genau eine Grenze trägt: Uploads brauchen
# eine engere als ein Kontaktformular. Die Werte müssen zu RATE_LIMIT_TIERS in
# lib/rate-limit-policy.ts passen; tests/rate-limit.test.mjs prüft das.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_STRICT"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
